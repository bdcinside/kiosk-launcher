# Put this file at .github/workflows/build-kiosk-launcher.yml in a fork of
# https://github.com/kh-menachem/kiosk-launcher
# This builds the UNMODIFIED upstream sources checked out in your fork.
name: Build Kiosk Launcher APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable APK (upstream debug-key release configuration)
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Calculate SHA-256
        shell: bash
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt
      - name: Save APK as downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-launcher-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
