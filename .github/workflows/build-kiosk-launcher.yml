
# Kiosk Launcher – automatischer APK-Build
# Repository: https://github.com/kh-menachem/kiosk-launcher

name: Build Kiosk Launcher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Quellcode herunterladen
      - name: Check out source code
        uses: actions/checkout@v4

      # 2. Java 17 einrichten
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK einrichten
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Android SDK Platform installieren
      - name: Install Android SDK platform 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      # 5. Gradle einrichten
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Fehlende Android Kiosk Bibliothek erstellen
      - name: Build required Android Kiosk library
        shell: bash
        run: |
          git clone --depth 1 https://github.com/kh-menachem/android-kiosk.git /tmp/android-kiosk
          gradle -p /tmp/android-kiosk :kiosk:assembleRelease --no-daemon
          mkdir -p app/libs
          cp /tmp/android-kiosk/kiosk/build/outputs/aar/kiosk-release.aar app/libs/kiosk.aar
          test -s app/libs/kiosk.aar

      # 7. Kiosk Launcher APK erstellen
      - name: Build installable APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # 8. SHA-256 Prüfsumme erstellen
      - name: Calculate SHA-256
        shell: bash
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt

      # 9. APK zum Download bereitstellen
      - name: Save APK as downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-launcher-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
